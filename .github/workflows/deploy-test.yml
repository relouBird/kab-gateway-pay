name: Deploy test to PlanetHoster

on:
  push:
    branches:
      - test
  workflow_dispatch:
    inputs:
      mode:
        description: initialize (premier déploiement) ou deploy
        required: true
        type: choice
        options:
          - deploy
          - initialize
        default: deploy

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/build-artifacts.yml
    with:
      mode: ${{ inputs.mode || 'deploy' }}
      target_environment: test
    secrets: inherit
