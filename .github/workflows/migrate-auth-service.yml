name: Apply auth-service production migrations

on:
  workflow_dispatch:
    inputs:
      build_sha:
        description: Full commit SHA of a deposited main build
        required: true
        type: string
      backup_confirmed:
        description: Confirm a restorable production database backup exists
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: kgpay-production-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply reviewed auth-service migrations
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate migration request
        env:
          BUILD_SHA: ${{ inputs.build_sha }}
          BACKUP_CONFIRMED: ${{ inputs.backup_confirmed }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == "main" ]] || {
            echo "Production migrations must be dispatched from main."
            exit 1
          }
          [[ "$BUILD_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "build_sha must be a full 40-character commit SHA."
            exit 1
          }
          [[ "$BACKUP_CONFIRMED" == "true" ]] || {
            echo "Confirm a restorable database backup before continuing."
            exit 1
          }

      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SERVER_SSH_KEY"
          test -n "$SERVER_SSH_KNOWN_HOSTS"
          printf '%s\n' "$SERVER_SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$SERVER_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          chmod 600 "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/known_hosts"

      - name: Run migrate deploy on PlanetHoster
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT || '5022' }}
          SERVER_DEPLOY_ROOT: ${{ vars.SERVER_DEPLOY_ROOT }}
          SERVER_NODE_ENV_ACTIVATE: ${{ vars.SERVER_NODE_ENV_ACTIVATE }}
          SERVER_PRODUCTION_ENV_FILE: ${{ vars.SERVER_PRODUCTION_ENV_FILE }}
          BUILD_SHA: ${{ inputs.build_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SERVER_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$SERVER_USER" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$SERVER_SSH_PORT" =~ ^[0-9]+$ ]]
          [[ "$SERVER_DEPLOY_ROOT" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$SERVER_NODE_ENV_ACTIVATE" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$SERVER_PRODUCTION_ENV_FILE" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$SERVER_DEPLOY_ROOT" != *".."* ]]
          [[ "$SERVER_NODE_ENV_ACTIVATE" != *".."* ]]
          [[ "$SERVER_PRODUCTION_ENV_FILE" != *".."* ]]
          test "$SERVER_SSH_PORT" -ge 1
          test "$SERVER_SSH_PORT" -le 65535

          remote="$SERVER_USER@$SERVER_HOST"
          printf -v remote_command 'bash -s -- %q %q %q %q' \
            "$SERVER_DEPLOY_ROOT" \
            "$SERVER_NODE_ENV_ACTIVATE" \
            "$SERVER_PRODUCTION_ENV_FILE" \
            "$BUILD_SHA"
          ssh -i "$RUNNER_TEMP/deploy_key" \
            -p "$SERVER_SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            "$remote" "$remote_command" <<'REMOTE'
          set -eu
          root="$1"
          node_env_activate="$2"
          production_env="$3"
          revision="$4"
          release="$root/builds/$revision"
          tool_dir="$root/tools/prisma-migrator"

          case "$production_env" in
            "$root"/*)
              echo "The production environment file must be outside the deploy tree."
              exit 1
              ;;
          esac
          test -f "$node_env_activate"
          test -f "$production_env"
          test -r "$production_env"
          test -f "$release/manifest.json"
          test -f "$release/services/auth-service/prisma/schema.prisma"
          test -f "$release/deploy-tools/prisma-migrator/package-lock.json"

          source "$node_env_activate"
          node --version
          node - "$release/manifest.json" "$revision" <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (manifest.commit !== process.argv[3] || manifest.ref !== 'main') {
            throw new Error('The selected artifact is not a deposited main revision.');
          }
          NODE

          mkdir -p "$tool_dir"
          cp "$release/deploy-tools/prisma-migrator/package.json" \
            "$release/deploy-tools/prisma-migrator/package-lock.json" \
            "$release/deploy-tools/prisma-migrator/migrate.cjs" \
            "$tool_dir/"
          (
            cd "$tool_dir"
            npm ci --omit=dev
            node migrate.cjs \
              --env-file "$production_env" \
              --schema "$release/services/auth-service/prisma/schema.prisma"
          )
          REMOTE
