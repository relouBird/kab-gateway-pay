name: Build and deploy KG Pay to PlanetHoster

# Workflow interne partagé par le premier déploiement et les déploiements normaux.
# Le build et les fichiers d'environnement sont préparés sur GitHub, puis publiés sur PH.
on:
  workflow_call:
    inputs:
      mode:
        description: initialize or deploy
        required: true
        type: string
      target_environment:
        description: GitHub environment to deploy to
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kgpay-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy ${{ inputs.target_environment }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.target_environment }}

    steps:
      - name: Validate deployment inputs
        env:
          DEPLOY_MODE: ${{ inputs.mode }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          TARGET_ENVIRONMENT_MARKER: ${{ vars.KG_PAY_DEPLOY_TARGET }}
          KG_PAY_APP_ENV: ${{ secrets.KG_PAY_APP_ENV }}
        shell: bash
        run: |
          set -euo pipefail
          case "$TARGET_ENVIRONMENT" in
            production)
              expected_branch="main"
              ;;
            test)
              expected_branch="test"
              ;;
            *)
              echo "Unknown deployment environment: $TARGET_ENVIRONMENT"
              exit 1
              ;;
          esac
          if [[ "$GITHUB_REF_NAME" != "$expected_branch" ]]; then
            echo "Deployment to $TARGET_ENVIRONMENT is allowed only from $expected_branch."
            exit 1
          fi
          if [[ "$TARGET_ENVIRONMENT" == "test" && "$TARGET_ENVIRONMENT_MARKER" != "test" ]]; then
            echo "::error::Set the test environment variable KG_PAY_DEPLOY_TARGET to test."
            exit 1
          fi
          if [[ "$DEPLOY_MODE" != "initialize" && "$DEPLOY_MODE" != "deploy" ]]; then
            echo "Unknown deployment mode: $DEPLOY_MODE"
            exit 1
          fi
          if [[ -z "$KG_PAY_APP_ENV" ]]; then
            echo "::error::KG_PAY_APP_ENV is required in the $TARGET_ENVIRONMENT environment."
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run focused deployment tests
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            scripts/generate-env.test.cjs \
            scripts/bump-version.test.cjs \
            deploy-tools/release-manager.test.cjs \
            deploy-tools/publish-portals.test.cjs
          for script in \
            deploy-tools/upload-release.sh \
            deploy-tools/deploy-release.sh \
            deploy-tools/planet-host-deploy.sh \
            deploy-tools/build-argon2-for-planethoster.sh; do
            bash -n "$script"
          done

      - name: Build workspaces and stage the auth-service environment
        env:
          KG_PAY_APP_ENV: ${{ secrets.KG_PAY_APP_ENV }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f .env; rm -rf .generated/env' EXIT
          test -n "$KG_PAY_APP_ENV"
          (umask 077; printf '%s' "$KG_PAY_APP_ENV" > .env)
          unset KG_PAY_APP_ENV

          # Keep web build output readable; protect the source and generated environment files.
          umask 022
          pnpm run build

          generated_service_env=".generated/env/auth-service.env"
          service_env="$RUNNER_TEMP/kgpay-auth-service.env"
          if [[ ! -s "$generated_service_env" ]]; then
            echo "::error::auth-service production environment was not generated."
            exit 1
          fi
          if ! grep -Eq '^NODE_ENV=production\r?$' "$generated_service_env"; then
            echo "::error::auth-service environment must configure production mode."
            exit 1
          fi
          install -m 600 "$generated_service_env" "$service_env"

      - name: Package static builds and auth-service runtime
        shell: bash
        run: |
          set -euo pipefail
          umask 022
          release_dir="$RUNNER_TEMP/kgpay-release"
          archive="$RUNNER_TEMP/kgpay-build.tar.gz"
          mkdir -p "$release_dir"

          for workspace_root in apps packages; do
            while IFS= read -r -d '' dist_dir; do
              relative_parent="$(dirname "$dist_dir")"
              mkdir -p "$release_dir/$relative_parent"
              cp -a "$dist_dir" "$release_dir/$relative_parent/"
            done < <(
              find "$workspace_root" \
                -type d -name node_modules -prune -o \
                -type d -name dist -prune -print0
            )
          done

          for portal in customer-portal staff-portal; do
            portal_dist="$release_dir/apps/$portal/dist"
            test -f "$portal_dist/index.html"
            test -f "$portal_dist/favicon.svg"
            find "$portal_dist" -type d -exec chmod 755 {} +
            find "$portal_dist" -type f -exec chmod 644 {} +
          done

          pnpm --filter auth-service deploy --prod --legacy \
            "$release_dir/services/auth-service"

          bash deploy-tools/build-argon2-for-planethoster.sh "$release_dir"

          (
            cd "$release_dir/services/auth-service"
            test ! -e .env
            node <<'NODE'
          require('@kgpay/contracts');
          require('@nestjs/core');
          require('argon2');
          const { PrismaClient } = require('./dist/generated/prisma/client.js');
          const { PrismaPg } = require('@prisma/adapter-pg');
          const adapter = new PrismaPg({
            connectionString: 'postgresql://build:synthetic@127.0.0.1:5432/kgpay',
            connectionTimeoutMillis: 1000,
          });
          const prisma = new PrismaClient({ adapter });
          if (typeof prisma.$connect !== 'function') process.exit(1);
          prisma.$disconnect().catch(() => { process.exitCode = 1; });
          NODE
          )

          test -f "$release_dir/packages/contracts/dist/index.js"
          test -f "$release_dir/services/auth-service/dist/main.js"
          test -f "$release_dir/services/auth-service/dist/generated/prisma/client.js"
          test -f "$release_dir/services/auth-service/dist/cli/bootstrap-super-admin.js"
          test -f "$release_dir/services/auth-service/prisma/schema.prisma"
          test -f "$release_dir/services/auth-service/prisma/migrations/migration_lock.toml"
          test -f "$release_dir/services/auth-service/node_modules/@nestjs/core/package.json"
          test -f "$release_dir/services/auth-service/node_modules/@kgpay/contracts/package.json"
          find "$release_dir/services/auth-service/prisma/migrations" \
            -mindepth 2 -name migration.sql -print -quit | grep -q .
          if find "$release_dir" -type f \
            \( -name .env -o -name '.env.*' \) -print -quit | grep -q .; then
            echo "A .env file must never be included in the release."
            exit 1
          fi

          node - "$release_dir" <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const releaseDir = process.argv[2];
          const manifest = {
            commit: process.env.GITHUB_SHA,
            ref: process.env.GITHUB_REF_NAME,
            version: require('./package.json').version,
          };
          fs.writeFileSync(
            path.join(releaseDir, 'manifest.json'),
            `${JSON.stringify(manifest, null, 2)}\n`,
          );
          NODE

          tar -C "$release_dir" -czf "$archive" .

      - name: Save GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: kgpay-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kgpay-build.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SSH_PRIVATE_KEY" ]]; then
            echo "::error::SSH_PRIVATE_KEY is empty or unavailable in the production environment."
            exit 1
          fi
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/deploy_key"
          chmod 600 "$RUNNER_TEMP/deploy_key"

      # Partie 1/2 : validation des chemins et transfert des artefacts vers incoming/.
      - name: Upload release to PlanetHoster
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT || '5022' }}
          SERVER_DEPLOY_ROOT: ${{ secrets.SERVER_DEPLOY_ROOT }}
          SERVER_NODE_ENV_ACTIVATE: ${{ secrets.SERVER_NODE_ENV_ACTIVATE }}
          SERVER_AUTH_SERVICE_NODE_ENV_ACTIVATE: ${{ secrets.SERVER_AUTH_SERVICE_NODE_ENV_ACTIVATE }}
          SERVER_AUTH_SERVICE_APP_ROOT: ${{ secrets.SERVER_AUTH_SERVICE_APP_ROOT }}
          SERVER_KGAPPS_ROOT: ${{ secrets.SERVER_KGAPPS_ROOT }}
          REPOSITORY: ${{ github.repository }}
          DEPLOY_MODE: ${{ inputs.mode }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
          DEPLOY_ENVIRONMENT: ${{ inputs.target_environment }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SERVER_DEPLOY_ROOT" || "$SERVER_DEPLOY_ROOT" == "/" ]]; then
            echo "::error::SERVER_DEPLOY_ROOT must be a non-root absolute path."
            exit 1
          fi
          if [[ "$DEPLOY_ENVIRONMENT" == "test" ]]; then
            SERVER_DEPLOY_ROOT="${SERVER_DEPLOY_ROOT%/}/test"
          fi
          export SERVER_DEPLOY_ROOT
          bash deploy-tools/upload-release.sh

      # Partie 2/2 : promotion de la release, publication web et redémarrage sur PH.
      - name: Apply release on PlanetHoster
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT || '5022' }}
          SERVER_DEPLOY_ROOT: ${{ secrets.SERVER_DEPLOY_ROOT }}
          SERVER_NODE_ENV_ACTIVATE: ${{ secrets.SERVER_NODE_ENV_ACTIVATE }}
          SERVER_AUTH_SERVICE_NODE_ENV_ACTIVATE: ${{ secrets.SERVER_AUTH_SERVICE_NODE_ENV_ACTIVATE }}
          SERVER_AUTH_SERVICE_APP_ROOT: ${{ secrets.SERVER_AUTH_SERVICE_APP_ROOT }}
          SERVER_KGAPPS_ROOT: ${{ secrets.SERVER_KGAPPS_ROOT }}
          REPOSITORY: ${{ github.repository }}
          DEPLOY_MODE: ${{ inputs.mode }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
          DEPLOY_ENVIRONMENT: ${{ inputs.target_environment }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SERVER_DEPLOY_ROOT" || "$SERVER_DEPLOY_ROOT" == "/" ]]; then
            echo "::error::SERVER_DEPLOY_ROOT must be a non-root absolute path."
            exit 1
          fi
          if [[ "$DEPLOY_ENVIRONMENT" == "test" ]]; then
            SERVER_DEPLOY_ROOT="${SERVER_DEPLOY_ROOT%/}/test"
          fi
          export SERVER_DEPLOY_ROOT
          bash deploy-tools/deploy-release.sh

      - name: Remove temporary deployment credentials
        if: always()
        shell: bash
        run: |
          rm -f -- \
            "$RUNNER_TEMP/kgpay-auth-service.env" \
            "$RUNNER_TEMP/deploy_key"
