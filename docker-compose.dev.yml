services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kgpay_auth
      POSTGRES_USER: kgpay
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - kgpay-auth-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kgpay -d kgpay_auth"]
      interval: 5s
      timeout: 5s
      retries: 10
  maildev:
    image: maildev/maildev:2.2.1
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:1080:1080"

volumes:
  kgpay-auth-postgres:
